name: connectcall
description: ConnectCall - Connect with anyone, anywhere. A functional 1-to-1 calling application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # UI
  cupertino_icons: ^1.0.6
  cached_network_image: ^3.3.1

  # Storage & Persistence
  shared_preferences: ^2.2.3

  # Permissions
  permission_handler: ^12.0.1

  # Calling - ZegoCloud UIKit (WebRTC 1-to-1 audio/video)
  zego_uikit_prebuilt_call: ^4.24.4
  # ZegoCloud signalling — push-style incoming calls between devices
  zego_uikit_signaling_plugin: ^2.8.0

  # Utilities
  uuid: ^4.4.0
  intl: ^0.19.0
  timeago: ^3.6.1
  logger: ^2.3.0
  connectivity_plus: ^6.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
