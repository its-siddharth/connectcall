org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Disable Kotlin incremental compilation — required when pub cache (C:\) and
# project (D:\) are on different Windows drives (cross-drive path bug in kotlinc)
kotlin.incremental=false
kotlin.incremental.android=false
# Move Gradle user home to D:\ (same drive as project)
org.gradle.user.home=D:\\gradle-home
# Disable parallel workers — fixes "Could not move temporary workspace" rename
# errors caused by multiple workers racing to write the same transform output
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.configureondemand=false
org.gradle.configuration-cache=false
